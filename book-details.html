<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book details | Online Library</title>
  <!-- CSS TEAM: every page uses this one file, css/style.css. Create it and write all the styles there.
       Tip: start with the header, buttons and book cards because they appear on every page. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="book-details">

  <!-- HEADER (the same on every page, so copy any change to all pages).
       JS TEAM:
        1. Check localStorage for a logged-in user.
        2. If someone is logged in, change the text of #auth-btn to "Log out (name)". Unhide the links that have data-auth="user". Admins also get data-auth="admin".
        Hint: element.hidden = false;
        3. When the user clicks Log out, remove the saved user and go to index.html.
       CSS TEAM: the link of the page you are on has aria-current="page". Style it with a[aria-current="page"] { } -->
  <header class="site-header">
    <a class="site-header__brand" href="index.html">Online Library</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="catalog.html" aria-current="page">Catalog</a>
      <a href="my-library.html" data-auth="user" hidden>My Library</a>
      <a href="admin.html" data-auth="admin" hidden>Admin</a>
      <a href="login.html" id="auth-btn" class="btn">Log in</a>
    </nav>
  </header>

  <main class="page page--book-details">
    <!-- BOOK DETAILS PAGE: the same information as the pop-up, but as its own page (book-details.html?id=1).
         JS TEAM: read the id from the address, find the book, and fill the data-field elements. You can reuse the same function as the pop-up. -->
    <p><a href="catalog.html">&larr; Back to catalog</a></p>
    <article class="book-details" data-book-id="">
      <div class="book-details__cover" aria-hidden="true" data-field="cover"></div>
      <div class="book-details__info">
        <h1 data-field="title">Book title</h1>
        <p class="muted"><span data-field="author">Author</span> &middot; <span data-field="genre">Genre</span> &middot; <span data-field="year">Year</span> &middot; <span data-field="type">Format</span></p>
        <p data-field="description">Short description.</p>
        <p class="status" data-field="availability">Available (2 of 2 copies)</p>
        <!-- CHAPTERS: only shown when the series has 2 or more chapters.
             JS TEAM: fill #chapter-list with one list item per chapter, each with a link like reader.html?id=28&ch=2.
             Also change the Read button: if the user has saved progress, say "Continue reading" and point it at the saved chapter.
             CSS TEAM: if the list is long, make it scroll (max-height and overflow-y: auto). -->
        <section id="chapter-section" class="chapters" hidden>
          <h3>Chapters</h3>
          <ol id="chapter-list" class="chapter-list"></ol>
        </section>
        <div class="actions">
          <a id="btn-read" class="btn" href="reader.html">Read online</a>
          <button id="btn-list" type="button" class="btn btn--ghost">Add to reading list</button>
          <button id="btn-borrow" type="button" class="btn btn--ghost">Borrow</button>
          <button id="btn-return" type="button" class="btn btn--ghost" hidden>Return book</button>
          <button id="btn-wait" type="button" class="btn btn--ghost" hidden>Join the waitlist</button>
          <button id="btn-unwait" type="button" class="btn btn--ghost" hidden>Leave waitlist</button>
        </div>
      </div>
    </article>
  </main>

  <!-- TOAST: a small message such as "Borrowed" or "Saved".
       JS TEAM: write a function showToast(text) that sets the text, removes hidden, and adds hidden back after about 2 seconds (setTimeout).
       CSS TEAM: place it at the bottom center of the screen with position: fixed. -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="site-footer">
    <p>Online Library &middot; BSIT Group 1 &middot; ICCT Colleges Foundation Inc. &middot; School project</p>
  </footer>

  <!-- SCRIPTS: the order matters. app.js holds the code every page needs (it also loads the book list from library/books.json), and the last file is only for this page. -->
  <script src="js/app.js"></script>
  <script src="js/book-details.js"></script>
</body>
</html>
