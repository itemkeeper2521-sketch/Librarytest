<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in | Online Library</title>
  <!-- CSS TEAM: every page uses this one file, css/style.css. Create it and write all the styles there.
       Tip: start with the header, buttons and book cards because they appear on every page. -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">

  <!-- HEADER (the same on every page, so copy any change to all pages).
       JS TEAM:
        1. Check localStorage for a logged-in user.
        2. If someone is logged in, change the text of #auth-btn to "Log out (name)". Unhide the links that have data-auth="user". Admins also get data-auth="admin".
        Hint: element.hidden = false;
        3. When the user clicks Log out, remove the saved user and go to index.html.
       CSS TEAM: the link of the page you are on has aria-current="page". Style it with a[aria-current="page"] { } -->
  <header class="site-header">
    <a class="site-header__brand" href="index.html">Online Library</a>
    <nav class="site-nav" aria-label="Main">
      <a href="index.html">Home</a>
      <a href="catalog.html">Catalog</a>
      <a href="my-library.html" data-auth="user" hidden>My Library</a>
      <a href="admin.html" data-auth="admin" hidden>Admin</a>
      <a href="login.html" aria-current="page" id="auth-btn" class="btn">Log in</a>
    </nav>
  </header>

  <main class="page page--login">
    <!-- LOGIN AND REGISTER PAGE: two forms, and only one is visible at a time.
         JS TEAM:
          1. The links #show-register and #show-login switch between the forms (toggle the hidden attribute).
          2. Register: check the username is not taken and both passwords match, then add the user to the list saved in localStorage.
          3. Log in: look for a user with the same username and password. Save the username as the logged-in user, then go to catalog.html.
          4. Show problems (for example "Wrong username or password") inside the paragraph with class form-error.
          5. Create the demo admin on first load: username admin, password admin123, role admin.
          Note: saving plain passwords is fine for a school demo, but a real website must never do this.
         CSS TEAM: center .auth-card and make the inputs full width. -->
    <section class="auth-card">
      <form id="login-form" class="form" novalidate>
        <h1>Log in</h1>
        <label>Username<input id="login-user" name="username" autocomplete="username" required minlength="3"></label>
        <label>Password<input id="login-pass" name="password" type="password" autocomplete="current-password" required minlength="5"></label>
        <p class="form-error" aria-live="polite"></p>
        <button type="submit" class="btn">Log in</button>
        <p class="muted">No account? <a href="#" id="show-register">Register</a></p>
      </form>

      <form id="register-form" class="form" novalidate hidden>
        <h1>Register</h1>
        <label>Username<input id="reg-user" name="username" autocomplete="username" required minlength="3"></label>
        <label>Password<input id="reg-pass" name="password" type="password" autocomplete="new-password" required minlength="5"></label>
        <label>Confirm password<input id="reg-pass2" name="password2" type="password" autocomplete="new-password" required></label>
        <p class="form-error" aria-live="polite"></p>
        <button type="submit" class="btn">Create account</button>
        <p class="muted">Have an account? <a href="#" id="show-login">Log in</a></p>
      </form>
    </section>
  </main>

  <!-- TOAST: a small message such as "Borrowed" or "Saved".
       JS TEAM: write a function showToast(text) that sets the text, removes hidden, and adds hidden back after about 2 seconds (setTimeout).
       CSS TEAM: place it at the bottom center of the screen with position: fixed. -->
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <footer class="site-footer">
    <p>Online Library &middot; BSIT Group 1 &middot; ICCT Colleges Foundation Inc. &middot; School project</p>
  </footer>

  <!-- SCRIPTS: the order matters. app.js holds the code every page needs (it also loads the book list from library/books.json), and the last file is only for this page. -->
  <script src="js/app.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
